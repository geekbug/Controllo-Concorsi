name: Web Link Monitor

on:
  # Per attivare il controllo automatico ogni 5 minuti dopo aver configurato i Secrets,
  # rimuovi il simbolo '#' dalle due righe qui sotto ('schedule:' e '- cron:'):
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch: # Permette di avviare lo script manualmente dalla scheda Actions

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Garantisce il permesso di aggiornare known_links.json tramite git push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run monitor script
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      run: python monitor.py

    - name: Commit and push changes
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add known_links.json
        git diff-index --quiet HEAD || (git commit -m "Aggiornamento automatico dei link noti [skip ci]" && git pull --rebase && git push)
